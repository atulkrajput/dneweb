# =============================================================================
# CircleCI Configuration — DNE Consultants
# Laravel 12 + React (Vite) → Hostinger Shared Hosting via SSH/rsync
# Deploys only from the master branch.
# =============================================================================

version: 2.1

# ---------------------------------------------------------------------------
# Orbs — pre-built packages for common CI tasks
# ---------------------------------------------------------------------------
orbs:
  node: circleci/node@5.2.0

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:
  # =========================================================================
  # BUILD — Install dependencies and compile frontend assets
  # =========================================================================
  build:
    docker:
      - image: cimg/php:8.2-node
    working_directory: ~/project
    steps:
      # -- Checkout source code
      - checkout

      # -- Restore Composer cache for faster builds
      - restore_cache:
          keys:
            - composer-v1-{{ checksum "composer.lock" }}
            - composer-v1-

      # -- Install PHP dependencies (no dev for production)
      - run:
          name: Install Composer dependencies
          command: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      # -- Save Composer cache
      - save_cache:
          key: composer-v1-{{ checksum "composer.lock" }}
          paths:
            - vendor

      # -- Restore npm cache for faster builds
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-

      # -- Install Node.js dependencies
      - run:
          name: Install npm dependencies
          command: npm ci

      # -- Save npm cache
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

      # -- Build frontend assets (Vite production build)
      - run:
          name: Build Vite assets
          command: npm run build

      # -- Persist the workspace for the deploy job
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  # =========================================================================
  # DEPLOY — Upload files to Hostinger via rsync over SSH
  # =========================================================================
  deploy:
    docker:
      - image: cimg/base:stable
    working_directory: ~/project
    steps:
      # -- Attach the built workspace from the build job
      - attach_workspace:
          at: ~/project

      # -- Add server to known_hosts to avoid interactive prompt
      # -- SSH key is configured in CircleCI project settings
      - add_ssh_keys
      - run:
          name: Install rsync and add server to known_hosts
          command: |
            sudo apt-get update && sudo apt-get install -y rsync
            mkdir -p ~/.ssh
            ssh-keyscan -p $SSH_PORT $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

      # -- Deploy files via rsync
      # -- Excludes sensitive/unnecessary files that should never be uploaded
      - run:
          name: Deploy files via rsync
          command: |
            rsync -azP --delete \
              --exclude='.git' \
              --exclude='.gitignore' \
              --exclude='.gitattributes' \
              --exclude='node_modules' \
              --exclude='.circleci' \
              --exclude='.env' \
              --exclude='.env.example' \
              --exclude='.htaccess' \
              --exclude='public/.htaccess' \
              --exclude='storage/logs/*' \
              --exclude='storage/framework/cache/data/*' \
              --exclude='storage/framework/sessions/*' \
              --exclude='storage/framework/views/*' \
              --exclude='storage/app/*' \
              --exclude='OLDCode' \
              --exclude='Branding' \
              --exclude='docs' \
              --exclude='.github' \
              --exclude='.editorconfig' \
              --exclude='.styleci.yml' \
              --exclude='tests' \
              --exclude='phpunit.xml' \
              -e "ssh -p $SSH_PORT" \
              ~/project/ $SSH_USER@$SSH_HOST:/domains/dneconsultants.com/public_html/

      # -- Run post-deployment commands on the server via remote script
      - run:
          name: Run post-deployment commands
          command: |
            cat > /tmp/deploy.sh \<<'SCRIPT'
            set -e
            cd /domains/dneconsultants.com/public_html
            echo ">>> Installing Composer dependencies..."
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            echo ">>> Running database migrations..."
            php artisan migrate --force
            echo ">>> Clearing caches..."
            php artisan optimize:clear
            echo ">>> Building optimized cache..."
            php artisan optimize
            if [ ! -L public/storage ]; then
              echo ">>> Creating storage symlink..."
              php artisan storage:link
            else
              echo ">>> Storage symlink already exists, skipping."
            fi
            echo ">>> Deployment complete!"
            SCRIPT
            ssh -p $SSH_PORT $SSH_USER@$SSH_HOST 'bash -s' < /tmp/deploy.sh

# ---------------------------------------------------------------------------
# Workflows — orchestrate job execution
# ---------------------------------------------------------------------------
workflows:
  version: 2

  # Only build and deploy when pushing to master
  build-and-deploy:
    jobs:
      - build:
          filters:
            branches:
              only: master

      - deploy:
          requires:
            - build
          filters:
            branches:
              only: master
